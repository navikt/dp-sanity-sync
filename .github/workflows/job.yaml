name: Bygg og deploy
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Bygg
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generer .npmrc
        run: |
          cat <<'EOF' > .npmrc
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          @navikt:registry=https://npm.pkg.github.com/
          engine-strict=true
          EOF

      - name: Bygg og push Docker image
        uses: nais/docker-build-push@v1
        id: docker-build-push
        with:
          team: teamdagpenger
          build_secrets: NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}
          push_image: true
          dockerfile: Dockerfile
          docker_context: .

  deploy-dev:
    permissions:
      contents: "read"
      id-token: "write"
    name: Deploy til dev-gcp
    needs: [ build ]
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/job.yaml
          VARS: .nais/vars-dev.yaml
          PRINT_PAYLOAD: true
  deploy-prod:
    permissions:
      contents: "read"
      id-token: "write"
    name: Deploy til prod-gcp
    needs: [ build ]
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/job.yaml
          VARS: .nais/vars-prod.yaml
          PRINT_PAYLOAD: true
